[package]
name = "claurst"
version.workspace = true
edition.workspace = true

[[bin]]
name = "claurst"
path = "src/main.rs"

[features]
default = ["voice"]
voice = ["claurst-core/voice", "claurst-tui/voice"]

[dependencies]
claurst-core = { workspace = true }
claurst-api = { workspace = true }
claurst-acp = { workspace = true }
claurst-tools = { workspace = true }
claurst-query = { workspace = true }
claurst-tui = { workspace = true }
claurst-commands = { workspace = true }
claurst-mcp = { workspace = true }
claurst-bridge = { workspace = true }
claurst-buddy = { workspace = true }
claurst-plugins = { workspace = true }
tokio = { workspace = true }
async-trait = { workspace = true }
clap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
uuid = { workspace = true }
tokio-util = { workspace = true }
chrono = { workspace = true }
reqwest = { workspace = true }
url = { workspace = true }
crossterm = { workspace = true }
parking_lot = { workspace = true }
dirs = { workspace = true }
base64 = "0.22"
sha2 = "0.10"
open = "5"
urlencoding = "2"
xxhash-rust = { version = "0.8", features = ["xxh64"] }

[target.'cfg(unix)'.dependencies]
# Only the root/sudo check in main.rs reaches for this, and that check is itself
# cfg(unix). On Windows nix collapses to an empty crate, so leaving it in the
# unconditional table only bought a wasted build of nix, libc and cfg_aliases.
nix = { workspace = true }

[build-dependencies]
chrono = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
