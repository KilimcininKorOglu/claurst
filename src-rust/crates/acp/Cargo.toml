[package]
name = "mikmik-acp"
version.workspace = true
edition.workspace = true
description = "Agent Client Protocol (ACP) server for Claurst — JSON-RPC 2.0 over stdio"

[dependencies]
mikmik-core = { workspace = true }
mikmik-api = { workspace = true }
mikmik-tools = { workspace = true }
mikmik-query = { workspace = true }
mikmik-commands = { workspace = true }
mikmik-mcp = { workspace = true }
mikmik-plugins = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
async-trait = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
dashmap = { workspace = true }
parking_lot = { workspace = true }
futures = { workspace = true }
dirs = { workspace = true }
# `session/fork` and `session/set_model` are still marked unstable in the
# schema, so the shape of those requests may change with the next release of
# the crate.
agent-client-protocol-schema = { version = "0.13", default-features = false, features = [
    "unstable_session_fork",
    "unstable_session_model",
] }

[dev-dependencies]
tempfile = { workspace = true }
