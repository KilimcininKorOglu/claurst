[package]
name = "mikmik-commands"
version.workspace = true
edition.workspace = true

[features]
# Pass-through features from cc-core
ultraplan = ["mikmik-core/ultraplan"]

[dependencies]
mikmik-core = { workspace = true }
mikmik-api = { workspace = true }
mikmik-tools = { workspace = true }
mikmik-query = { workspace = true }
mikmik-mcp = { workspace = true }
mikmik-tui = { workspace = true }
mikmik-plugins = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
async-trait = { workspace = true }
chrono = { workspace = true }
dirs = { workspace = true }
regex = { workspace = true }
reqwest = { workspace = true }
arboard = { version = "3", default-features = false }
urlencoding = { workspace = true }
open = { workspace = true }
qrcode = { workspace = true }
mikmik-bridge = { workspace = true }
mikmik-buddy = { workspace = true }
hostname = "0.4"
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-native-roots"] }
futures = { workspace = true }
once_cell = { workspace = true }
parking_lot = { workspace = true }
base64 = { workspace = true }
tempfile = { workspace = true }
