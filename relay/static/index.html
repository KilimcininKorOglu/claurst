<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<meta name="referrer" content="same-origin">
<title>claurst relay</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>

<section id="view-token" class="view" hidden>
  <form id="token-form" class="panel">
    <h1>claurst relay</h1>
    <p class="hint">Enter the relay token from your settings file.</p>
    <input id="token-input" type="password" inputmode="text" autocomplete="off"
           autocapitalize="off" spellcheck="false" placeholder="relay token" required>
    <button type="submit">Unlock</button>
    <p id="token-error" class="error" hidden></p>
  </form>
</section>

<section id="view-sessions" class="view" hidden>
  <header class="bar">
    <h1>Sessions</h1>
    <button id="refresh" type="button" class="ghost">Refresh</button>
  </header>
  <ul id="session-list" class="sessions"></ul>
  <p id="sessions-empty" class="hint" hidden>No session is connected. Run <code>/remote-control start</code> on your machine.</p>
</section>

<section id="view-session" class="view" hidden>
  <header class="bar">
    <button id="back" type="button" class="ghost">Back</button>
    <h1 id="session-title">Session</h1>
    <button id="cancel" type="button" class="ghost danger">Stop</button>
  </header>

  <div id="stream" class="stream" aria-live="polite"></div>

  <div id="permission" class="permission" hidden>
    <p id="permission-tool" class="permission-tool"></p>
    <p id="permission-desc" class="permission-desc"></p>
    <div class="permission-actions" id="permission-actions">
      <button type="button" data-decision="allow">Allow once</button>
      <button type="button" data-decision="allow_permanently">Allow this session</button>
      <button type="button" data-decision="deny" class="danger">Deny</button>
    </div>
    <p class="permission-local" id="permission-local" hidden>Waiting for an answer at the terminal. This request cannot be answered from here.</p>
  </div>

  <div id="question" class="permission question" hidden>
    <p id="question-text" class="permission-tool"></p>
    <div class="permission-actions" id="question-options"></div>
    <form id="question-form" class="question-form">
      <input id="question-input" type="text" placeholder="Or type an answer" autocomplete="off">
      <button type="submit">Answer</button>
    </form>
  </div>

  <p id="attachments" class="attachments" hidden></p>
  <form id="prompt-form" class="composer">
    <input id="file-input" type="file" accept="image/*,text/*" multiple hidden>
    <button type="button" id="attach" class="ghost" title="Attach a file" aria-label="Attach a file">+</button>
    <textarea id="prompt-input" rows="1" placeholder="Message" autocomplete="off"></textarea>
    <button type="submit" id="send">Send</button>
  </form>
  <p id="session-busy" class="status busy" hidden>Working…</p>
  <p id="session-status" class="status" hidden></p>
</section>

<script src="/app.js"></script>
</body>
</html>
