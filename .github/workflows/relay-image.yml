name: Relay image

# Publishes the relay container to ghcr.io so operators can pull instead of
# building. Building from source stays the documented default: relay/
# docker-compose.yml keeps `build: .`, and the token this service accepts is a
# remote code-execution credential, so reading the source you run is a
# reasonable thing to want.
#
# Tagged by commit sha rather than a version. relay/Cargo.toml carries
# `publish = false` and is deliberately left out of scripts/bump-version.py, so
# the relay has no release version to tag with.

on:
  push:
    branches: [main]
    paths:
      - 'relay/**'
      - '.github/workflows/relay-image.yml'
  workflow_dispatch:

concurrency:
  group: relay-image-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}-relay

jobs:
  publish:
    runs-on: ubuntu-latest
    name: Build and push

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=main
            type=sha,format=long

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: relay
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # The registry cache keeps the dependency layer warm between runs;
          # the Dockerfile builds dependencies before copying src for the same
          # reason.
          cache-from: type=gha
          cache-to: type=gha,mode=max
